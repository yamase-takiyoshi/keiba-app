name: Build X96 TV APK
on:
  push:
    branches:
      - build/x96-tv-apk-20261010
  workflow_dispatch:
jobs:
  apk:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK platform
        shell: bash
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          SDKMGR="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          echo "sdkmanager=$SDKMGR"
          test -n "$SDKMGR"
          yes | "$SDKMGR" --licenses >/dev/null || true
          "$SDKMGR" --install "platforms;android-34" "build-tools;34.0.0"
      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Compile APK
        run: gradle --no-daemon --stacktrace assembleDebug
      - name: Save APK
        uses: actions/upload-artifact@v4
        with:
          name: Keiba-X96-TV-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
